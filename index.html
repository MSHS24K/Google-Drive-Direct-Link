<script>function generateLink() {
  var linkInput = document.getElementById("gdrive-link").value;
  var linkId = linkInput.match(/\/d\/(.*)\//)[1];
  var directLink = "https://drive.google.com/uc?export=download&id=" + linkId;
  document.getElementById("output").innerHTML =
    '<input type="text" value="' +
    directLink +
    '" id="direct-link-input"><button onclick="copyLink()" id="copy-button">Copy Link</button>';
}
{
  /* Coding created by Shift Media | https://shiftmediaegy.blogspot.com */
}

function copyLink() {
  var copyText = document.getElementById("direct-link-input");
  copyText.select();
  copyText.setSelectionRange(0, 99999);
  document.execCommand("copy");

  var copyButton = document.getElementById("copy-button");
  copyButton.innerText = "Copied!";
  setTimeout(function () {
    copyButton.innerText = "Copy Link";
  }, 2000);

  removeSelection();
}

function resetForm() {
  document.getElementById("gdrive-link").value = "";
  document.getElementById("output").innerHTML = "";
}

{
  /* Coding created by Shift Media | https://shiftmediaegy.blogspot.com */
}

function removeSelection() {
  if (window.getSelection) {
    window.getSelection().removeAllRanges();
  } else if (document.selection) {
    document.selection.empty();
  }
}
</script>
